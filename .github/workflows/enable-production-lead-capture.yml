name: Enable production lead capture

# Sets ASSESSMENT_STORAGE_MODE=supabase on Vercel Production and redeploys, so
# free-assessment submissions are written to the canonical Supabase project
# instead of being discarded by the mock adapter.
#
# Manual dispatch only, and it requires typing the confirmation phrase: this is
# the switch that starts storing customer data in production.
#
# Reverting is the same workflow with mode=mock.

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Storage adapter for Production
        required: true
        default: supabase
        type: choice
        options:
          - supabase
          - mock
      confirm:
        description: Type ENABLE PRODUCTION WRITES to proceed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: enable-production-lead-capture
  cancel-in-progress: false

jobs:
  configure:
    name: Set the Production storage adapter and redeploy
    if: github.repository == 'Bear78888/bizmetria.ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      VERCEL_TEAM_ID: team_16CsPHPlAUmw7W3mN2Qpf6RL
      VERCEL_PROJECT_ID: prj_HUVYbskD1dwszdohnm1zQ0wLqcA4
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      TARGET_MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Require the confirmation phrase
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "ENABLE PRODUCTION WRITES" ]; then
            echo "Confirmation phrase did not match. Nothing was changed." >&2
            exit 1
          fi

      - name: Set ASSESSMENT_STORAGE_MODE on Production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing." >&2; exit 1; }
          echo "::add-mask::$VERCEL_TOKEN"

          node <<'NODE'
          (async () => {
            const token = process.env.VERCEL_TOKEN;
            const teamId = process.env.VERCEL_TEAM_ID;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const mode = process.env.TARGET_MODE;
            const base = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`;
            const query = `teamId=${encodeURIComponent(teamId)}`;
            const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };

            const listResponse = await fetch(`${base}?${query}&decrypt=false`, { headers });
            if (!listResponse.ok) {
              throw new Error(`Listing environment variables failed: ${listResponse.status}`);
            }
            const { envs = [] } = await listResponse.json();

            // Only a plain, project-owned Production variable is touched. An
            // integration-owned value (configurationId set) belongs to whoever
            // installed it and must not be overwritten from here.
            const existing = envs.find(
              (env) =>
                env.key === 'ASSESSMENT_STORAGE_MODE' &&
                Array.isArray(env.target) &&
                env.target.includes('production') &&
                !env.gitBranch &&
                !env.configurationId,
            );

            if (existing) {
              const patch = await fetch(`${base}/${encodeURIComponent(existing.id)}?${query}`, {
                method: 'PATCH',
                headers,
                body: JSON.stringify({ value: mode }),
              });
              if (!patch.ok) {
                throw new Error(`Updating the variable failed: ${patch.status} ${await patch.text()}`);
              }
              console.log(`Updated ASSESSMENT_STORAGE_MODE to "${mode}" on Production.`);
            } else {
              const create = await fetch(`${base}?${query}`, {
                method: 'POST',
                headers,
                body: JSON.stringify({
                  key: 'ASSESSMENT_STORAGE_MODE',
                  value: mode,
                  type: 'plain',
                  target: ['production'],
                }),
              });
              if (!create.ok) {
                throw new Error(`Creating the variable failed: ${create.status} ${await create.text()}`);
              }
              console.log(`Created ASSESSMENT_STORAGE_MODE="${mode}" on Production.`);
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Redeploy production so the new value takes effect
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$VERCEL_TOKEN"

          # Vercel captures environment variables when a deployment is created,
          # so the running deployment keeps the previous value until replaced.
          #
          # Done through the REST API rather than the CLI: the CLI's flags drift
          # between releases, and `npx vercel@latest` silently picks up whatever
          # is current. An earlier attempt failed because `vercel ls` stopped
          # accepting `--yes`. The API surface is versioned in the path.
          node <<'NODE'
          (async () => {
            const token = process.env.VERCEL_TOKEN;
            const teamId = process.env.VERCEL_TEAM_ID;
            const projectId = process.env.VERCEL_PROJECT_ID;
            const headers = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
            const team = `teamId=${encodeURIComponent(teamId)}`;

            const listUrl =
              `https://api.vercel.com/v6/deployments?${team}` +
              `&projectId=${encodeURIComponent(projectId)}&target=production&state=READY&limit=1`;
            const listResponse = await fetch(listUrl, { headers });
            if (!listResponse.ok) {
              throw new Error(`Listing production deployments failed: ${listResponse.status}`);
            }
            const { deployments = [] } = await listResponse.json();
            const current = deployments[0];
            if (!current) throw new Error('No ready production deployment to redeploy.');
            console.log(`Redeploying ${current.uid} (${current.url}).`);

            const createResponse = await fetch(`https://api.vercel.com/v13/deployments?${team}`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                name: 'bizmetria-ai',
                deploymentId: current.uid,
                target: 'production',
              }),
            });
            const created = await createResponse.json();
            if (!createResponse.ok) {
              throw new Error(
                `Creating the redeployment failed: ${createResponse.status} ${created?.error?.message ?? ''}`,
              );
            }
            console.log(`Created deployment ${created.id}.`);
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Verify the deployment reports the new adapter
        shell: bash
        run: |
          set -euo pipefail
          # The redeployment has to build before it serves, so this waits
          # rather than reading the still-live previous deployment.
          for attempt in $(seq 1 40); do
            body="$(curl -fsS https://bizmetria-ai.vercel.app/api/health || true)"
            echo "attempt $attempt: $body"
            if printf '%s' "$body" | grep -q "\"assessmentStorage\":\"$TARGET_MODE\""; then
              echo "Production reports assessmentStorage=$TARGET_MODE."
              exit 0
            fi
            sleep 10
          done
          echo "Production never reported assessmentStorage=$TARGET_MODE." >&2
          exit 1
