# Provisions the Retell interview agents (EN/ES) and stores their ids in
# Vercel, without the API key ever leaving Vercel/GitHub secrets scope.
#
# The key is read from the project's Production environment via the Vercel
# API, used once to run scripts/provision-retell-agents.mjs (idempotent), and
# the resulting agent ids are written back as RETELL_AGENT_ID_EN/ES. A
# redeploy is still required for the running deployment to pick the ids up —
# use deploy-production.yml, which ships current main.

name: Provision Retell interview agents

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PROVISION RETELL AGENTS" to proceed'
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.repository == 'Bear78888/bizmetria.ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      VERCEL_TEAM_ID: team_16CsPHPlAUmw7W3mN2Qpf6RL
      VERCEL_PROJECT_ID: prj_HUVYbskD1dwszdohnm1zQ0wLqcA4
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONFIRMATION: ${{ inputs.confirm }}

    steps:
      - name: Require the confirmation phrase
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "PROVISION RETELL AGENTS" ]; then
            echo "Confirmation phrase did not match. Nothing was changed." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provision agents with the key read from Vercel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing." >&2; exit 1; }
          echo "::add-mask::$VERCEL_TOKEN"

          RETELL_API_KEY=$(node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const base = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`;

          const response = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}&decrypt=true`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) {
            throw new Error(`Listing environment variables failed: ${response.status}`);
          }
          const { envs = [] } = await response.json();
          const entry = envs.find(
            (env) =>
              env.key === 'RETELL_API_KEY' &&
              Array.isArray(env.target) &&
              env.target.includes('production') &&
              !env.gitBranch &&
              !env.configurationId,
          );
          if (!entry || !entry.value) {
            throw new Error(
              'RETELL_API_KEY not readable from Vercel Production env. If it was stored as "Sensitive", re-create it as a plain encrypted variable or run the provisioning script where the key is available.',
            );
          }
          process.stdout.write(entry.value);
          NODE
          )
          test -n "$RETELL_API_KEY" || { echo "Empty RETELL_API_KEY." >&2; exit 1; }
          echo "::add-mask::$RETELL_API_KEY"

          RETELL_API_KEY="$RETELL_API_KEY" node scripts/provision-retell-agents.mjs | tee provision-output.txt

      - name: Store agent ids in Vercel Production env
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$VERCEL_TOKEN"

          for KEY in RETELL_AGENT_ID_EN RETELL_AGENT_ID_ES; do
            VALUE=$(grep -oP "^${KEY}=\Kagent_\S+" provision-output.txt || true)
            if [ -z "$VALUE" ]; then
              echo "No value for $KEY in provisioning output." >&2
              exit 1
            fi
            KEY="$KEY" VALUE="$VALUE" node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const key = process.env.KEY;
          const value = process.env.VALUE;
          const base = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`;

          const listResponse = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!listResponse.ok) {
            throw new Error(`Listing environment variables failed: ${listResponse.status}`);
          }
          const { envs = [] } = await listResponse.json();
          const existing = envs.find(
            (env) =>
              env.key === key &&
              Array.isArray(env.target) &&
              env.target.includes('production') &&
              !env.gitBranch &&
              !env.configurationId,
          );

          if (existing) {
            const patch = await fetch(
              `${base}/${existing.id}?teamId=${encodeURIComponent(teamId)}`,
              {
                method: 'PATCH',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ value }),
              },
            );
            if (!patch.ok) throw new Error(`Updating ${key} failed: ${patch.status}`);
            console.log(`${key}: updated to ${value}`);
          } else {
            const create = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ key, value, type: 'encrypted', target: ['production'] }),
            });
            if (!create.ok) throw new Error(`Creating ${key} failed: ${create.status}`);
            console.log(`${key}: created as ${value}`);
          }
          NODE
          done

          echo ""
          echo "Agent ids stored. Run deploy-production.yml so the deployment picks them up."
