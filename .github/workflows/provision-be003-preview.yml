name: Provision BE-003 preview infrastructure

"on":
  push:
    branches:
      - task/ws-09/BE-003-public-site-free-assessment-v2
    paths:
      - .github/workflows/provision-be003-preview.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: provision-be003-preview
  cancel-in-progress: false

jobs:
  provision:
    name: Create Supabase branch and wire Vercel Preview
    if: github.repository == 'Bear78888/bizmetria.ai' && github.ref == 'refs/heads/task/ws-09/BE-003-public-site-free-assessment-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    env:
      CANONICAL_SUPABASE_PROJECT_REF: rbndiytodvoyiejassnw
      SUPABASE_PREVIEW_BRANCH_NAME: pr-21-be-003
      GIT_BRANCH: task/ws-09/BE-003-public-site-free-assessment-v2
      VERCEL_TEAM_ID: team_16CsPHPlAUmw7W3mN2Qpf6RL
      VERCEL_TEAM_SLUG: jorgiohenes-7252s-projects
      VERCEL_PROJECT_ID: prj_HUVYbskD1dwszdohnm1zQ0wLqcA4
      VERCEL_PROJECT_NAME: bizmetria-ai
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: task/ws-09/BE-003-public-site-free-assessment-v2
          fetch-depth: 1

      - name: Validate protected inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "SUPABASE_ACCESS_TOKEN is missing." >&2; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing." >&2; exit 1; }
          test "$CANONICAL_SUPABASE_PROJECT_REF" = "rbndiytodvoyiejassnw" || exit 1
          test "$GIT_BRANCH" = "task/ws-09/BE-003-public-site-free-assessment-v2" || exit 1
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$VERCEL_TOKEN"

      - name: Create or reuse the isolated Supabase Preview Branch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
          const baseUrl = 'https://api.supabase.com';
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const parentRef = process.env.CANONICAL_SUPABASE_PROJECT_REF;
          const branchName = process.env.SUPABASE_PREVIEW_BRANCH_NAME;
          const gitBranch = process.env.GIT_BRANCH;
          const githubEnv = process.env.GITHUB_ENV;

          if (!token || !parentRef || !branchName || !gitBranch || !githubEnv) {
            throw new Error('Required protected input is missing.');
          }

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function request(path, options = {}, acceptedStatuses = [200]) {
            let lastError;

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const response = await fetch(`${baseUrl}${path}`, {
                ...options,
                headers: {
                  Authorization: `Bearer ${token}`,
                  'Content-Type': 'application/json',
                  ...(options.headers || {}),
                },
              });

              if (acceptedStatuses.includes(response.status)) {
                if (response.status === 204) return null;
                const text = await response.text();
                return text ? JSON.parse(text) : null;
              }

              const text = (await response.text()).slice(0, 500);
              lastError = new Error(`Supabase Management API ${response.status}: ${text || 'empty response'}`);

              if (![429, 500, 502, 503, 504].includes(response.status) || attempt === 3) {
                throw lastError;
              }

              const retryAfter = Number(response.headers.get('retry-after'));
              await sleep(Number.isFinite(retryAfter) && retryAfter > 0 ? retryAfter * 1000 : attempt * 3000);
            }

            throw lastError || new Error('Supabase Management API request failed.');
          }

          function verifyBranch(branch, requireReadyProjectRef = true) {
            if (!branch || branch.name !== branchName) {
              throw new Error('Supabase returned an unexpected branch name.');
            }
            if (branch.parent_project_ref !== parentRef) {
              throw new Error('Supabase branch parent does not match the canonical BizMetria project.');
            }
            if (
              requireReadyProjectRef &&
              (branch.project_ref === parentRef || !/^[a-z]{20}$/u.test(branch.project_ref || ''))
            ) {
              throw new Error('Supabase returned an invalid preview project ref.');
            }
            if (branch.git_branch && branch.git_branch !== gitBranch) {
              throw new Error('Existing Supabase branch is associated with a different Git branch.');
            }
            if (branch.with_data === true) {
              throw new Error('Supabase Preview Branch unexpectedly contains copied production data.');
            }
            if (branch.persistent === true) {
              throw new Error('Supabase Preview Branch unexpectedly became persistent.');
            }
          }

          const branches = await request(`/v1/projects/${encodeURIComponent(parentRef)}/branches`);
          let branch = Array.isArray(branches) ? branches.find((item) => item.name === branchName) : undefined;

          if (!branch) {
            branch = await request(
              `/v1/projects/${encodeURIComponent(parentRef)}/branches`,
              {
                method: 'POST',
                body: JSON.stringify({
                  branch_name: branchName,
                  git_branch: gitBranch,
                  is_default: false,
                  persistent: false,
                  with_data: false,
                }),
              },
              [201],
            );
          }

          verifyBranch(branch, false);

          let apiKeys;
          for (let attempt = 1; attempt <= 120; attempt += 1) {
            try {
              branch = await request(
                `/v1/projects/${encodeURIComponent(parentRef)}/branches/${encodeURIComponent(branchName)}`,
              );
              verifyBranch(branch);

              apiKeys = await request(
                `/v1/projects/${encodeURIComponent(branch.project_ref)}/api-keys?reveal=true`,
              );

              if (Array.isArray(apiKeys) && apiKeys.some((key) => key.api_key)) break;
            } catch (error) {
              if (attempt === 120) throw error;
            }

            if (attempt === 120) {
              throw new Error('Supabase Preview Branch did not become ready within 10 minutes.');
            }
            await sleep(5000);
          }

          const publishable = apiKeys.find(
            (key) =>
              key.type === 'publishable' ||
              String(key.api_key || '').startsWith('sb_publishable_') ||
              /(^|[_ -])anon($|[_ -])/iu.test(String(key.name || '')),
          )?.api_key;
          const secret = apiKeys.find(
            (key) =>
              key.type === 'secret' ||
              String(key.api_key || '').startsWith('sb_secret_') ||
              /service[_ -]?role/iu.test(String(key.name || '')),
          )?.api_key;

          if (!publishable || !secret) {
            throw new Error('Supabase Preview Branch keys were not available in the expected format.');
          }

          const previewUrl = `https://${branch.project_ref}.supabase.co`;
          for (const value of [publishable, secret, previewUrl, branch.project_ref]) {
            console.log(`::add-mask::${value}`);
          }

          fs.appendFileSync(
            githubEnv,
            [
              `SUPABASE_PREVIEW_URL=${previewUrl}`,
              `SUPABASE_PREVIEW_PUBLISHABLE_KEY=${publishable}`,
              `SUPABASE_PREVIEW_SECRET_KEY=${secret}`,
              `SUPABASE_PREVIEW_PROJECT_REF=${branch.project_ref}`,
            ].join('\n') + '\n',
            { encoding: 'utf8', mode: 0o600 },
          );

          console.log('Supabase Preview Branch is ready, isolated, data-less, and tied to the intended Git branch.');
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : 'Supabase Preview provisioning failed.');
            process.exitCode = 1;
          });
          NODE

      - name: Verify the development seed was not loaded
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/seed-check.json"
          status=""
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "apikey: $SUPABASE_PREVIEW_SECRET_KEY" \
              "$SUPABASE_PREVIEW_URL/rest/v1/integration_events?select=id&source=eq.synthetic_seed&external_event_id=eq.synthetic-foundation-event-001&limit=1")"
            [[ "$status" == "200" ]] && break
            sleep 5
          done
          test "$status" = "200" || { echo "Preview seed verification failed with HTTP $status." >&2; exit 1; }
          node -e 'const fs=require("node:fs"); const rows=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!Array.isArray(rows) || rows.length !== 0) process.exit(1);' "$response_file" \
            || { echo "The development seed unexpectedly exists in the Preview Branch." >&2; exit 1; }
          rm -f "$response_file"
          echo "Preview Branch contains no development seed row."

      - name: Create or update the canonical GitHub Actions repository variable
        id: github-variable
        shell: bash
        run: |
          set -euo pipefail
          if gh variable set SUPABASE_PROJECT_REF \
            --repo "$GITHUB_REPOSITORY" \
            --body "$CANONICAL_SUPABASE_PROJECT_REF"; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Canonical repository variable is configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Repository variable needs owner action::The workflow token could not update SUPABASE_PROJECT_REF. No secret was exposed."
          fi

      - name: Link the checked-out source to the existing Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node -e 'const fs=require("node:fs"); fs.writeFileSync(".vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_TEAM_ID,projectId:process.env.VERCEL_PROJECT_ID}));'

      - name: Replace only this Git branch's Vercel Preview Supabase variables
        shell: bash
        run: |
          set -euo pipefail

          set_vercel_env() {
            local name="$1"
            local value="$2"
            local sensitivity="${3:-public}"
            local args=(env add "$name" preview "$GIT_BRANCH" --force --yes --no-color --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG")
            if [[ "$sensitivity" == "sensitive" ]]; then
              args+=(--sensitive)
            fi
            printf '%s' "$value" | npx --yes vercel@latest "${args[@]}" >/dev/null
          }

          set_vercel_env NEXT_PUBLIC_SUPABASE_URL "$SUPABASE_PREVIEW_URL"
          set_vercel_env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PREVIEW_PUBLISHABLE_KEY"
          set_vercel_env SUPABASE_SECRET_KEY "$SUPABASE_PREVIEW_SECRET_KEY" sensitive
          set_vercel_env SUPABASE_PROJECT_REF "$CANONICAL_SUPABASE_PROJECT_REF"
          set_vercel_env SUPABASE_BRANCH_PROJECT_REF "$SUPABASE_PREVIEW_PROJECT_REF"
          set_vercel_env SUPABASE_BRANCH_NAME "$SUPABASE_PREVIEW_BRANCH_NAME"
          set_vercel_env SUPABASE_GIT_BRANCH "$GIT_BRANCH"
          set_vercel_env ASSESSMENT_STORAGE_MODE mock

          npx --yes vercel@latest env ls preview "$GIT_BRANCH" \
            --no-color --token "$VERCEL_TOKEN" --scope "$VERCEL_TEAM_SLUG" \
            > "$RUNNER_TEMP/vercel-preview-env.txt"

          for required_name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SECRET_KEY \
            SUPABASE_PROJECT_REF \
            SUPABASE_BRANCH_PROJECT_REF \
            SUPABASE_BRANCH_NAME \
            SUPABASE_GIT_BRANCH \
            ASSESSMENT_STORAGE_MODE; do
            grep -Fq "$required_name" "$RUNNER_TEMP/vercel-preview-env.txt" \
              || { echo "Missing Vercel Preview variable name: $required_name" >&2; exit 1; }
          done
          rm -f "$RUNNER_TEMP/vercel-preview-env.txt"
          echo "Branch-scoped Vercel Preview variables are configured without exposing their values."

      - name: Build and deploy a fresh Vercel Preview with the branch-scoped variables
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull \
            --yes \
            --environment=preview \
            --git-branch="$GIT_BRANCH" \
            --no-color \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_SLUG" \
            >/dev/null
          npx --yes vercel@latest build \
            --no-color \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_SLUG"
          npx --yes vercel@latest deploy \
            --prebuilt \
            --yes \
            --no-color \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_TEAM_SLUG"

      - name: Publish a non-secret provisioning summary
        if: always()
        shell: bash
        run: |
          {
            echo '## BE-003 Preview provisioning'
            echo
            echo "- Supabase branch requested: \`$SUPABASE_PREVIEW_BRANCH_NAME\`"
            echo "- Git branch: \`$GIT_BRANCH\`"
            echo "- Production data copied: no"
            echo "- Development seed expected: no"
            echo "- Vercel variable scope: Preview + exact Git branch only"
            echo "- Assessment persistence mode: mock until the runtime branch guard is reviewed"
            echo "- GitHub repository variable configured: ${{ steps.github-variable.outputs.configured || 'unknown' }}"
            echo "- Production database writes: none"
            echo "- Force push: none"
          } >> "$GITHUB_STEP_SUMMARY"
