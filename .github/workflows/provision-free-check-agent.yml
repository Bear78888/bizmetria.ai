# Provisions the free-check phone agent and its inbound number, storing
# RETELL_FREE_AGENT_ID and NEXT_PUBLIC_FREE_CHECK_PHONE in Vercel Production.
#
# Buying the number bills the Retell account (~$2/month plus per-minute
# usage), which is why this is manual-dispatch with a confirmation phrase.
# Idempotent: reruns converge the prompt/webhook and reuse the number.
# A deploy (deploy-production.yml) is needed afterwards so the site shows
# the number and the webhook recognises the agent.

name: Provision free-check phone agent

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PROVISION FREE PHONE AGENT" to proceed'
        required: true
        type: string
      area_code:
        description: US area code for the inbound number
        required: true
        default: '415'
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.repository == 'Bear78888/bizmetria.ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development
    env:
      VERCEL_TEAM_ID: team_16CsPHPlAUmw7W3mN2Qpf6RL
      VERCEL_PROJECT_ID: prj_HUVYbskD1dwszdohnm1zQ0wLqcA4
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONFIRMATION: ${{ inputs.confirm }}
      FREE_CHECK_AREA_CODE: ${{ inputs.area_code }}

    steps:
      - name: Require the confirmation phrase
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "PROVISION FREE PHONE AGENT" ]; then
            echo "Confirmation phrase did not match. Nothing was changed." >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provision agent and number with the key read from Vercel
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is missing." >&2; exit 1; }
          echo "::add-mask::$VERCEL_TOKEN"

          RETELL_API_KEY=$(node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const base = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`;

          const response = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!response.ok) {
            throw new Error(`Listing environment variables failed: ${response.status}`);
          }
          const { envs = [] } = await response.json();
          const entry = envs.find(
            (env) =>
              env.key === 'RETELL_API_KEY' &&
              Array.isArray(env.target) &&
              env.target.includes('production') &&
              !env.gitBranch &&
              !env.configurationId,
          );
          if (!entry) {
            throw new Error('RETELL_API_KEY is not set on the Vercel Production environment.');
          }

          const detail = await fetch(
            `${base}/${entry.id}?teamId=${encodeURIComponent(teamId)}&decrypt=true`,
            { headers: { Authorization: `Bearer ${token}` } },
          );
          if (!detail.ok) {
            throw new Error(`Reading RETELL_API_KEY failed: ${detail.status}`);
          }
          const decrypted = await detail.json();
          if (!decrypted.value) {
            throw new Error('RETELL_API_KEY exists but its value is not readable.');
          }
          process.stdout.write(decrypted.value);
          NODE
          )
          test -n "$RETELL_API_KEY" || { echo "Empty RETELL_API_KEY." >&2; exit 1; }
          echo "::add-mask::$RETELL_API_KEY"

          RETELL_API_KEY="$RETELL_API_KEY" node scripts/provision-free-check-agent.mjs | tee provision-output.txt

      - name: Store agent id and phone number in Vercel Production env
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$VERCEL_TOKEN"

          for KEY in RETELL_FREE_AGENT_ID NEXT_PUBLIC_FREE_CHECK_PHONE; do
            VALUE=$(grep -oP "^${KEY}=\K\S+" provision-output.txt || true)
            if [ -z "$VALUE" ]; then
              echo "No value for $KEY in provisioning output." >&2
              exit 1
            fi
            KEY="$KEY" VALUE="$VALUE" node <<'NODE'
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_TEAM_ID;
          const projectId = process.env.VERCEL_PROJECT_ID;
          const key = process.env.KEY;
          const value = process.env.VALUE;
          const base = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}/env`;

          const listResponse = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!listResponse.ok) {
            throw new Error(`Listing environment variables failed: ${listResponse.status}`);
          }
          const { envs = [] } = await listResponse.json();
          const existing = envs.find(
            (env) =>
              env.key === key &&
              Array.isArray(env.target) &&
              env.target.includes('production') &&
              !env.gitBranch &&
              !env.configurationId,
          );

          if (existing) {
            const patch = await fetch(
              `${base}/${existing.id}?teamId=${encodeURIComponent(teamId)}`,
              {
                method: 'PATCH',
                headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ value }),
              },
            );
            if (!patch.ok) throw new Error(`Updating ${key} failed: ${patch.status}`);
            console.log(`${key}: updated`);
          } else {
            const create = await fetch(`${base}?teamId=${encodeURIComponent(teamId)}`, {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ key, value, type: 'encrypted', target: ['production'] }),
            });
            if (!create.ok) throw new Error(`Creating ${key} failed: ${create.status}`);
            console.log(`${key}: created`);
          }
          NODE
          done

          echo ""
          echo "Stored. Run deploy-production.yml so the site shows the number."
